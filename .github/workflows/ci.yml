name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Testovi pomoćnih funkcija
        run: npm run test:helpers
      - name: Instalacija preglednika
        run: npx playwright install --with-deps firefox webkit chromium msedge
      - name: Funkcionalni testovi (Firefox, Safari/WebKit, Edge, Opera/Chromium)
        run: npm run test:functional
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/ }
