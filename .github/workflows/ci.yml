name: CI

on:
  push:
    branches: [main, migracija/nextjs]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Install pnpm (Node 26 has no corepack)
        run: npm install --global pnpm@12.21.0 && test "$(pnpm --version)" = "12.21.0"
      - run: pnpm install --frozen-lockfile
      - name: Provjera tipova (tsc)
        run: pnpm typecheck
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Testovi pomoćnih funkcija, stranica i rute
        run: pnpm test
      - run: pnpm build
      - name: Instalacija preglednika
        run: pnpm exec playwright install --with-deps firefox webkit chromium msedge
      - name: Funkcionalni testovi (Firefox, Safari/WebKit, Edge, Opera/Chromium)
        run: pnpm test:functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: test-results/ }

  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@f2ad16d2ee7c7694123252ca4d4e8b78366334ee # main, DAN-1526

  dependency-review:
    # Compares the pull request's dependency changes; needs a pull_request event.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ductura/.github/.github/workflows/dependency-review.yml@f2ad16d2ee7c7694123252ca4d4e8b78366334ee # main, DAN-1526

  ci-ok:
    # Aggregate check for branch protection; fails unless every needed job succeeded.
    if: ${{ always() }}
    needs: [test, secret-scan, dependency-review]
    uses: ductura/.github/.github/workflows/ci-ok.yml@f2ad16d2ee7c7694123252ca4d4e8b78366334ee # main, DAN-1526
    with:
      results: ${{ toJSON(needs) }}
      # Skipped on push events, where there is no pull request to review.
      allow-skipped: dependency-review
