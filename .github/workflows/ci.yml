name: CI

on:
  push:
    branches: [main, migracija/nextjs]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Install pnpm (Node 26 has no corepack)
        run: npm install --global pnpm@12.21.0 && test "$(pnpm --version)" = "12.21.0"
      - run: pnpm install --frozen-lockfile
      - name: Provjera tipova (tsc)
        run: pnpm typecheck
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Testovi pomoćnih funkcija, stranica i rute
        run: pnpm test
      - run: pnpm build
      - name: Instalacija preglednika
        run: pnpm exec playwright install --with-deps firefox webkit chromium msedge
      - name: Funkcionalni testovi (Firefox, Safari/WebKit, Edge, Opera/Chromium)
        run: pnpm test:functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: test-results/ }

  ci-ok:
    # Zbirna provjera za zaštitu grana; pada ako `test` nije uspio.
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test.result }}" = "success"
